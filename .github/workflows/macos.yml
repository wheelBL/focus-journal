name: macOS build and native verification
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      npm_config_registry: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:platform
      - run: npm run build
      - run: npm run test:sites
      - run: node scripts/package-macos.mjs --arch=${{ matrix.arch }}
      - run: node scripts/package-macos.mjs --qa --arch=${{ matrix.arch }}
      - run: node scripts/run-macos-smoke.mjs
      - run: node scripts/check-macos-package.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FocusJournal-macOS-${{ matrix.arch }}-zip
          path: |
            desktop/release/macos-${{ matrix.arch }}/*.zip
            desktop/release/macos-${{ matrix.arch }}/SHA256SUMS-*.txt
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FocusJournal-macOS-${{ matrix.arch }}-dmg
          path: desktop/release/macos-${{ matrix.arch }}/*.dmg
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: macOS-${{ matrix.arch }}-verification
          path: desktop/qa-evidence/release-*/macos-${{ matrix.arch }}/
          retention-days: 14
